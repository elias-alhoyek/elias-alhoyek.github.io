<title>Elias Al Hoyek</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600&display=swap">
<style>
/* Layout concept: a lab recording sheet. A name and an empty photo slot sit above a live EMG strip where sample dots crowd together as the signal grows; each project opens full-screen out of its own card. */
:root{
  --bg:#eef2f4; --bg-2:#e2e9ed; --surface:#f8fafb; --fg:#0f1b26; --fg-2:#46576a; --line:#c4cfd8; --grid:#dae2e8;
  --signal:#086a7c; --sample:#a64b00;
  --shadow:0 24px 44px -26px rgba(15,27,38,.5);
  --f-display:"Bricolage Grotesque",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.22,.8,.18,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b121b; --bg-2:#111c28; --surface:#142130; --fg:#e7eff5; --fg-2:#94a7b7; --line:#273b4e; --grid:#16242f;
    --signal:#53d2e8; --sample:#ffab4f; --shadow:0 24px 44px -26px rgba(0,0,0,.85); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b121b; --bg-2:#111c28; --surface:#142130; --fg:#e7eff5; --fg-2:#94a7b7; --line:#273b4e; --grid:#16242f;
  --signal:#53d2e8; --sample:#ffab4f; --shadow:0 24px 44px -26px rgba(0,0,0,.85); color-scheme:dark;
}

*{box-sizing:border-box}
body{margin:0;font:400 1rem/1.65 var(--f-body);background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.08;margin:0;letter-spacing:-.02em;text-wrap:balance}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:3px;border-radius:6px}
.mono{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;line-height:1.45}
.wrap{width:100%;max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding-top:10px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;text-decoration:none;font:600 1.02rem var(--f-display);letter-spacing:-.01em}
.mark{flex:none;width:38px;height:38px;overflow:hidden;border:1.5px solid var(--fg);border-radius:11px;background:var(--bg-2);transition:border-color .3s,box-shadow .3s}
.mark img{display:block;width:100%;height:100%;object-fit:cover}
.brand:hover .mark{border-color:var(--signal);box-shadow:0 0 0 3px color-mix(in srgb,var(--signal) 22%,transparent)}
.nav{display:flex;gap:2px;order:1}
.nav a{padding:6px 13px;border-radius:999px;text-decoration:none;font-size:.9rem;color:var(--fg-2);white-space:nowrap;transition:background .3s,color .3s}
.nav a:hover{color:var(--fg)}
.nav a.on{background:var(--bg-2);color:var(--fg)}
.ctl{display:flex;align-items:center;gap:8px;order:2}
.lang{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.lang button{position:relative;z-index:1;min-width:40px;padding:5px 8px;border:0;background:none;border-radius:999px;cursor:pointer;font:500 .74rem var(--f-mono);letter-spacing:.06em;color:var(--fg-2);transition:color .3s}
.lang button[aria-pressed="true"]{color:var(--bg)}
.lang .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:999px;background:var(--fg);transition:transform .45s var(--ease)}
.lang[data-on="en"] .thumb{transform:translateX(100%)}
.theme{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;overflow:hidden}
.theme svg{grid-area:1/1;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:transform .6s var(--ease),opacity .3s}
.theme .sun{transform:rotate(-90deg) scale(.3);opacity:0}
.theme[data-mode="dark"] .sun{transform:none;opacity:1}
.theme[data-mode="dark"] .moon{transform:rotate(90deg) scale(.3);opacity:0}
@media (max-width:759px){
  .nav{order:3;width:100%;overflow-x:auto;scrollbar-width:none;margin-left:-6px}
  .nav a{padding:6px 10px}
}
@media (max-width:520px){
  .nav{gap:0}
  .nav a{padding:6px 7px}
  .nav::-webkit-scrollbar{display:none}
}

/* swap fade when the language changes */
main,footer,.nav{transition:opacity .18s ease,transform .18s ease}
body.swap main,body.swap footer,body.swap .nav{opacity:0;transform:translateY(8px)}

/* hero */
.hero{--name:clamp(2.7rem,11vw,7rem);padding-top:clamp(28px,6vw,76px);padding-bottom:26px}
.pill{display:inline-flex;align-items:center;gap:10px;max-width:100%;padding:8px 16px 8px 13px;border:1px solid var(--line);border-radius:16px;background:var(--surface);font:500 .78rem/1.4 var(--f-mono)}
.live{flex:none;width:8px;height:8px;border-radius:50%;background:var(--sample);animation:pulse 2.2s ease-out infinite}
.idrow{display:flex;align-items:center;gap:clamp(14px,3vw,36px);margin-top:22px;min-width:0}
h1{margin:0;min-width:0;font-size:var(--name);font-weight:700;line-height:.9;letter-spacing:-.04em}
h1 .line{display:block;overflow:hidden;padding-bottom:.14em;margin-bottom:-.14em}
h1 .line>span{display:block;animation:rise .9s var(--ease) both}
h1 .line:nth-child(2)>span{animation-delay:.09s;color:var(--signal)}
.photo{flex:none;margin:7px;width:calc(var(--name)*1.9);aspect-ratio:1;overflow:hidden;border-radius:50%;background:var(--bg-2);box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--signal);animation:photoIn 1s var(--ease) both}
.photo img{display:block;width:100%;height:100%;object-fit:cover}
.role{margin-top:22px;font:400 clamp(1.2rem,2.7vw,1.75rem)/1.25 var(--f-display);letter-spacing:-.01em;max-width:30ch}
.profile{margin-top:16px;max-width:58ch;color:var(--fg-2)}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;border:1.5px solid var(--fg);background:transparent;color:var(--fg);font:500 .95rem var(--f-body);text-decoration:none;cursor:pointer;transition:transform .3s var(--ease),background .3s,color .3s}
.btn:hover{transform:translateY(-3px)}
.btn:active{transform:scale(.97)}
.btn.solid{background:var(--fg);color:var(--bg)}
.btn.repo{margin-top:22px}

/* EMG strip */
.strip{padding-top:10px;padding-bottom:10px}
.strip-box{border:1px solid var(--line);border-radius:24px;overflow:hidden;background:var(--surface)}
.scope{background-color:var(--surface);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:100% 100px,100px 100%,100% 20px,20px 100%;background-position:0 -1px,-1px 0,0 -1px,-1px 0}
#emg{display:block;width:100%;height:190px;cursor:pointer;touch-action:manipulation}
.strip-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface)}
.key{display:inline-flex;align-items:center;gap:8px;color:var(--fg-2)}
.key i{display:block;width:22px;height:0;border-top:2px solid var(--signal)}
.key i.d{width:9px;height:9px;border:0;border-radius:50%;background:var(--sample)}
.strip-bar .cap{flex:1 1 260px;min-width:0;font-size:.84rem;line-height:1.45;color:var(--fg-2)}
.mini{display:inline-flex;align-items:center;text-decoration:none;color:var(--fg);padding:7px 15px;border:1px solid var(--fg);border-radius:999px;background:transparent;cursor:pointer;font:500 .74rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase;transition:background .3s,color .3s,transform .3s var(--ease)}
.mini:hover{background:var(--fg);color:var(--bg)}
.mini:active{transform:scale(.94)}

/* sections */
.sec{padding-top:clamp(52px,8vw,100px);scroll-margin-top:84px}
@media (max-width:759px){.sec{scroll-margin-top:120px}}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 24px;margin-bottom:28px}
.sec-head h2{font-size:clamp(2.1rem,5.4vw,3.4rem);font-weight:650}
.sec-head .mono{color:var(--fg-2)}

/* project cards */
.cards{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:16px}
@media (max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.cards{grid-template-columns:minmax(0,1fr)}}
.card{appearance:none;position:relative;display:flex;flex-direction:column;gap:14px;min-width:0;padding:22px;text-align:left;cursor:pointer;border:1px solid var(--line);border-radius:26px;background:var(--surface);transition:transform .5s var(--ease),border-color .3s,box-shadow .5s var(--ease)}
.card:hover{transform:translateY(-7px);border-color:var(--signal);box-shadow:var(--shadow)}
.card:active{transform:translateY(-3px) scale(.985)}
.card:focus-visible{outline:2px solid var(--signal);outline-offset:3px}
.card-top{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:8px}
.card .kind{color:var(--fg-2);min-width:0}
.tag-live{padding:2px 9px;border:1px solid var(--sample);border-radius:999px;color:var(--sample);white-space:nowrap}
.card h3{font-size:1.5rem;line-height:1.1}
.card p{font-size:.95rem;color:var(--fg-2)}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:auto;padding-top:8px}
.card .when{color:var(--fg-2)}
.card .go{display:inline-flex;align-items:center;gap:6px;color:var(--signal);font-weight:500;font-size:.92rem}
.card .go span{display:inline-block;transition:transform .4s var(--ease)}
.card:hover .go span{transform:translate(3px,-3px)}
.glyph{width:100%;height:46px;overflow:visible}
.g-line{fill:none;stroke:var(--fg-2);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.g-sig{stroke:var(--signal)}
.g-dot{fill:var(--sample);transform-box:fill-box;transform-origin:center}
.card:hover .g-dot{animation:blip .7s ease-in-out infinite alternate}
.card:hover .g-dot:nth-of-type(even){animation-delay:.15s}

/* background tabs */
.tabs{position:relative;display:flex;gap:4px;width:fit-content;max-width:100%;padding:4px;overflow-x:auto;border:1px solid var(--line);border-radius:999px;background:var(--surface);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{position:relative;z-index:1;padding:8px 18px;border:0;border-radius:999px;background:none;cursor:pointer;white-space:nowrap;font:500 .92rem var(--f-body);color:var(--fg-2);transition:color .3s}
.tabs button[aria-selected="true"]{color:var(--bg)}
.tabs .ink{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:999px;background:var(--fg);transition:transform .5s var(--ease),width .5s var(--ease)}
.panels{position:relative;margin-top:26px;transition:height .5s var(--ease)}
.panel{position:absolute;left:0;right:0;top:0;opacity:0;visibility:hidden;transform:translateY(14px);transition:opacity .35s ease,transform .5s var(--ease),visibility 0s .35s}
.panel.on{opacity:1;visibility:visible;transform:none;transition-delay:.12s,.12s,0s}
.trow{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:8px 28px;padding:22px 0;border-top:1px solid var(--line)}
.trow:last-child{border-bottom:1px solid var(--line)}

.trow h3{font-size:clamp(1.2rem,2.4vw,1.5rem);max-width:34ch}

.trow li{position:relative;padding-left:18px;font-size:.96rem}
.trow li::before,.did li::before{content:"";position:absolute;left:0;top:.7em;width:7px;height:7px;border-radius:50%;background:var(--signal)}
@media (max-width:640px){.trow{grid-template-columns:minmax(0,1fr)}.trow .when{padding-top:0}.tabs button{padding:8px 13px;font-size:.88rem}}

/* skills */
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:34px 28px}
.group h3{padding-top:14px;border-top:1.5px solid var(--fg);margin-bottom:16px;font:500 .74rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--fg-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-block;padding:8px 15px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:.92rem;line-height:1.35;transition:transform .35s var(--ease),background .3s,color .3s,border-color .3s}

/* contact */
.contact-box{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:clamp(24px,5vw,64px);align-items:start}

.rows{border-bottom:1px solid var(--line)}
.crow{display:grid;grid-template-columns:minmax(80px,120px) minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:16px 0;border-top:1px solid var(--line)}
.crow .mono{color:var(--fg-2)}

@media (max-width:520px){.crow{grid-template-columns:minmax(0,1fr) auto}.crow .mono{grid-column:1/-1}}

/* CV ribbon: a bookmark tab hanging off a slim band, just above Contact */
.cvband{margin-top:clamp(52px,8vw,100px);scroll-margin-top:84px}
@media (max-width:759px){.cvband{scroll-margin-top:120px}}
.cvrib{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:16px 28px;padding:20px 22px 20px 92px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}
.cv-tag{position:absolute;left:24px;top:-1px;width:46px;height:64px;display:flex;justify-content:center;padding-top:15px;background:var(--signal);color:var(--bg);font-weight:600;letter-spacing:.12em;clip-path:polygon(0 0,100% 0,100% 100%,50% calc(100% - 9px),0 100%);transform-origin:50% 0;animation:tagIn .9s var(--ease) both}
.cv-txt{flex:1 1 220px;min-width:0}
.cv-k{color:var(--fg-2)}
.cv-h{margin-top:4px;font:500 clamp(1.1rem,2.4vw,1.4rem)/1.3 var(--f-display);letter-spacing:-.01em}
.cv-btns{display:flex;flex-wrap:wrap;gap:10px}
.cvb{display:inline-flex;align-items:center;gap:12px;padding:10px 14px 10px 12px;border:1.5px solid var(--fg);border-radius:16px;background:transparent;color:var(--fg);text-decoration:none;cursor:pointer;transition:transform .3s var(--ease),background .3s,color .3s}
.cvb:hover{transform:translateY(-3px)}
.cvb:active{transform:scale(.97)}

.cvb-t{display:grid;gap:1px;line-height:1.25}
.cvb-t b{font-weight:500;font-size:.95rem}
.cvb-t .mono{font-size:.64rem;color:var(--fg-2);transition:color .3s}
.cvb-d{display:grid;place-items:center;width:28px;height:28px;border:1.5px solid currentColor;border-radius:50%;font-size:.95rem;line-height:1;transition:transform .35s var(--ease)}
.cvb:hover .cvb-d{transform:translateY(2px)}
.cvb.on{background:var(--fg);color:var(--bg)}

.cvb.drop .cvb-d{animation:drop .7s var(--ease)}
.cvb[aria-busy="true"]{pointer-events:none;opacity:.7}
.cv-note{flex-basis:100%;min-height:1.1em;margin:-4px 0 0;color:var(--signal);text-transform:none;letter-spacing:.04em}
.cv-note:empty{display:none}
@keyframes drop{0%{transform:translateY(0)}35%{transform:translateY(9px);opacity:0}36%{transform:translateY(-9px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes ringp{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--signal) 55%,transparent)}100%{box-shadow:0 0 0 14px transparent}}

footer{padding-top:64px;padding-bottom:40px;color:var(--fg-2)}

/* project detail, opens out of the clicked card */
html.lock{overflow:hidden}
.detail{position:fixed;inset:0;z-index:50;overflow-y:auto;overscroll-behavior:contain;background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}

article .d-kind{margin-bottom:16px}
.live-t{color:var(--sample)}

.sub{margin:0 0 14px;color:var(--fg-2);font:500 .74rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase}

/* sampling figure */
.sa-row+.sa-row{margin-top:20px}
.sa-row .mono{display:block;margin-bottom:6px;color:var(--fg-2)}
.sa{display:block;width:100%;height:auto;overflow:visible}
.sa .base{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}

.sa .df{fill:var(--fg-2)}
.sa .da{fill:var(--sample)}
.sa circle{transform-box:fill-box;transform-origin:center}

/* aim paragraph and roadmap figure */
.aim{margin:0 0 32px;max-width:56ch}
.road{list-style:none;margin:0;padding:0}
.step{position:relative;display:grid;justify-items:start;gap:4px;padding:0 0 28px 40px}
.step:last-child{padding-bottom:0}
.step::before{content:"";position:absolute;left:4px;top:3px;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:var(--surface)}
.step::after{content:"";position:absolute;left:12px;top:26px;bottom:3px;width:2px;background:linear-gradient(180deg,var(--line) 50%,transparent 50%) 0 0/2px 8px}
.step:last-child::after{display:none}
.step.now::before{border-color:var(--sample);background:var(--sample);animation:pulse 2.2s ease-out infinite}
.step.goal::before{border-color:var(--signal);background:var(--signal)}
.step .badge{padding:1px 10px;border:1px solid var(--line);border-radius:999px;color:var(--fg-2)}
.step.now .badge{border-color:var(--sample);color:var(--sample)}

/* chain figure */
.chain{display:flex;align-items:stretch}
.node{flex:1 1 0;min-width:0;padding:14px;border:1.5px solid var(--fg);border-radius:16px;background:var(--bg)}
.node b{display:block;font:600 1rem/1.2 var(--f-display);letter-spacing:-.01em}
.node small{display:block;margin-top:4px;font-size:.8rem;line-height:1.35;color:var(--fg-2)}
.link{position:relative;flex:0 0 70px;display:grid;place-items:center}
.link::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:linear-gradient(90deg,var(--signal) 50%,transparent 50%) 0 0/10px 2px}
.link span{position:relative;padding:2px 8px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font:500 .66rem var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--fg-2)}
.link.p::before{display:none}
.link.p span{border:0;background:none;font:400 1.5rem/1 var(--f-display);color:var(--signal)}
.chain.v,.chain.n{flex-direction:column}
.chain.v .link{flex:0 0 40px}
.chain.v .link::before{left:50%;right:auto;top:0;bottom:0;height:auto;width:2px;margin:0 0 0 -1px;background:linear-gradient(180deg,var(--signal) 50%,transparent 50%) 0 0/2px 10px}

  .chain.h .link{flex:0 0 46px}
  .chain.h .link::before{left:50%;right:auto;top:0;bottom:0;height:auto;width:2px;margin:0 0 0 -1px;background:linear-gradient(180deg,var(--signal) 50%,transparent 50%) 0 0/2px 10px}
}
.detail.open .chain.h .link::before{animation:dash .9s linear infinite}
.detail.open .chain.v .link::before{animation:dashv .9s linear infinite}
@media (max-width:640px){.detail.open .chain.h .link::before{animation:dashv .9s linear infinite}}

/* motion that plays when a project opens */
.detail.open .rise{animation:up .75s var(--ease) backwards;animation-delay:calc(var(--n,0)*80ms + 260ms)}
.detail.open .w{stroke-dasharray:1;animation:draw 1.5s .5s var(--ease) forwards}
.detail.open .dot{animation:pop .5s var(--ease) backwards;animation-delay:calc(var(--i)*16ms + .6s)}
@keyframes rise{from{transform:translateY(105%)}}
@keyframes photoIn{from{clip-path:circle(0%);transform:scale(.8)}to{clip-path:circle(75%)}}

@keyframes blip{to{transform:scale(1.9)}}

}

    exo: '<svg class="glyph" viewBox="0 0 200 46" aria-hidden="true"><path class="g-line" d="M4 7 C60 7 70 23 100 23"/><path class="g-line" d="M4 23 H100"/><path class="g-line" d="M4 39 C60 39 70 23 100 23"/>' +
      '<circle class="g-line g-sig" cx="114" cy="23" r="13"/><circle class="g-dot" cx="114" cy="23" r="3.6"/><path class="g-line g-sig" d="M131 23 H196"/><circle class="g-dot" cx="170" cy="23" r="2.4"/></svg>',
    calorimeter: '<svg class="glyph" viewBox="0 0 200 46" aria-hidden="true"><rect class="g-line" x="62" y="20" width="76" height="22" rx="6"/>' +
      '<path class="g-line g-sig" d="M80 15 q-5 -3.5 0 -7"/><path class="g-line g-sig" d="M100 15 q-5 -3.5 0 -7 q5 -3.5 0 -7"/><path class="g-line g-sig" d="M120 15 q-5 -3.5 0 -7"/>' +
      '<path class="g-line" d="M72 31 h14 v-5 h10 v10 h10 v-5 h22"/><circle class="g-dot" cx="72" cy="31" r="2.4"/><circle class="g-dot" cx="128" cy="31" r="2.4"/></svg>'
  };
  function rng(seed) {

  var WAVE = null;

  }
  function samplingRow(label, kind) {
    var pts = wave(), dots = [], d = 0;
    var path = pts.map(function (p, i) { return (i ? "L" : "M") + p.x + " " + p.y.toFixed(1); }).join(" ");
    pts.forEach(function (p) {
      if (kind === "fixed") { if (p.x % 20 === 0) dots.push(p); }
      else { d += 2; if (d >= 28 - 24 * clamp01((p.env - 0.15) / 0.6)) { dots.push(p); d = 0; } }
    });

    return '<div class="sa-row"><span class="mono">' + label + '</span><svg class="sa" viewBox="0 0 600 110" aria-hidden="true">' +
      '<line class="base" x1="0" y1="55" x2="600" y2="55"/><path class="w" pathLength="1" d="' + path + '"/>' +
      dots.map(function (p, i) { return '<circle class="dot ' + cls + '" style="--i:' + i + '" cx="' + p.x + '" cy="' + p.y.toFixed(1) + '" r="3"/>'; }).join("") +
      "</svg></div>";
  }
  function roadmapFig(p) {
    var r = p.road;
    return '<ol class="road">' + r.steps.map(function (st, i) {
      return '<li class="step ' + st.s + '" style="--i:' + i + '"><span class="badge mono">' + r[st.s] + "</span><b>" + st.t + "</b>" + (st.d ? "<small>" + st.d + "</small>" : "") + "</li>";
    }).join("") + "</ol>";
  }
  function chainFig(p) {
    return '<div class="chain ' + (p.vertical ? "v" : "h") + '">' + p.chain.map(function (c) {
      if (c.n) return '<div class="node"><b>' + c.n + "</b>" + (c.s ? "<small>" + c.s + "</small>" : "") + "</div>";
      if (c.l) return '<div class="link"><span>' + c.l + "</span></div>";
      if (c.p) return '<div class="link p"><span>+</span></div>';
      return '<div class="link"></div>';
    }).join("") + "</div>";
  }

  /* ---------- rendering ---------- */
  function renderCards() {
    var P = dict().projects;
    var count = P.items.length;
    $("#cards").style.setProperty("--cols", count % 3 === 0 ? 3 : (count % 2 === 0 ? 2 : 3));
    $("#cards").innerHTML = P.items.map(function (p, i) {
      return '<button class="card" type="button" data-p="' + i + '" aria-haspopup="dialog">' +
        '<span class="card-top"><span class="mono kind">' + p.kind + "</span>" + (p.live ? '<span class="mono tag-live">' + P.ongoing + "</span>" : "") + "</span>" +
        (GLYPH[p.glyph] || "") + "<h3>" + p.title + "</h3><p>" + p.summary + "</p>" +
        '<span class="card-foot"><span class="mono when">' + p.when + '</span><span class="go">' + P.open + ' <span aria-hidden="true">↗</span></span></span></button>';
    }).join("");
  }
  function renderSkills() {
    var S = dict().skills;
    $("#sk-tech").innerHTML = S.tech.map(function (x) { return '<li class="chip">' + x + "</li>"; }).join("");
    $("#sk-soft").innerHTML = S.soft.map(function (x) { return '<li class="chip">' + x + "</li>"; }).join("");
    $("#sk-lang").innerHTML = S.langs.map(function (x) { return "<li><span>" + x[0] + "</span><span>" + x[1] + "</span></li>"; }).join("");
  }
  var TABS = ["edu", "exp"], tab = "edu";
  var tro = null;
  function row(r) {
    return '<div class="trow"><div class="mono when">' + r.when + "</div><div><h3>" + r.title + '</h3><p class="org">' + r.org + "</p>" +
      (r.bullets ? "<ul>" + r.bullets.map(function (b) { return "<li>" + b + "</li>"; }).join("") + "</ul>" : "") + "</div></div>";
  }
  function renderTabs() {
    var B = dict().bg;
    $("#tablist").innerHTML = TABS.map(function (k) {
      return '<button type="button" role="tab" id="tab-' + k + '" aria-controls="panel-' + k + '" aria-selected="' + (k === tab) + '" tabindex="' + (k === tab ? 0 : -1) + '" data-tab="' + k + '">' + B.tabs[k] + "</button>";
    }).join("") + '<span class="ink" aria-hidden="true"></span>';
    $("#panels").innerHTML = TABS.map(function (k) {
      return '<div role="tabpanel" id="panel-' + k + '" aria-labelledby="tab-' + k + '" class="panel' + (k === tab ? " on" : "") + '"' + (k === tab ? "" : " inert") + ">" + B[k].map(row).join("") + "</div>";
    }).join("");

      if (tro) tro.disconnect();
      tro = new ResizeObserver(syncPanels);
      $$("#panels .panel").forEach(function (p) { tro.observe(p); });
      tro.observe($("#tablist"));
    }

  }
  function syncPanels() {
    var ink = $("#tablist .ink"), b = $('#tablist [aria-selected="true"]');
    if (ink && b) { ink.style.width = b.offsetWidth + "px"; ink.style.transform = "translateX(" + b.offsetLeft + "px)"; }
    var p = $("#panels .panel.on");
    if (p) $("#panels").style.height = p.offsetHeight + "px";
  }
  function selectTab(k, focus) {
    tab = k;
    $$("#tablist [role=tab]").forEach(function (b) { var on = b.dataset.tab === k; b.setAttribute("aria-selected", on); b.tabIndex = on ? 0 : -1; });
    $$("#panels .panel").forEach(function (p) { var on = p.id === "panel-" + k; p.classList.toggle("on", on); p.toggleAttribute("inert", !on); });
    syncPanels();
    if (focus) $("#tab-" + k).focus();
  }
  $("#tablist").addEventListener("click", function (e) { var b = e.target.closest("[role=tab]"); if (b) selectTab(b.dataset.tab); });
  $("#tablist").addEventListener("keydown", function (e) {
    var i = TABS.indexOf(tab), n = TABS.length;
    if (e.key === "ArrowRight") { selectTab(TABS[(i + 1) % n], true); e.preventDefault(); }
    else if (e.key === "ArrowLeft") { selectTab(TABS[(i + n - 1) % n], true); e.preventDefault(); }
    else if (e.key === "Home") { selectTab(TABS[0], true); e.preventDefault(); }
    else if (e.key === "End") { selectTab(TABS[n - 1], true); e.preventDefault(); }
  });

  /* ---------- language ---------- */
  function paint() {
    var d = dict();
    root.lang = lang;
    $$("[data-i]").forEach(function (el) { var v = pick(d, el.dataset.i); el.textContent = v == null ? "" : v; });
    $$("[data-ia]").forEach(function (el) { var p = el.dataset.ia.split(":"); var v = pick(d, p[1]); if (v != null) el.setAttribute(p[0], v); });
    $("#lang").dataset.on = lang;
    $$("#lang button").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.lang === lang); });
    renderCards(); renderSkills(); renderTabs(); syncTheme(); syncCv();
  }
  /* CV ribbon: the CV in the language being read comes first and is the solid one */
  function syncCv() {
    $$("#cv [data-cv]").forEach(function (a) {
      var mine = a.dataset.cv === lang;
      a.style.order = mine ? "0" : "1";
      a.classList.toggle("on", mine);
      a.lang = a.dataset.cv;
    });
    $("#cv-note").textContent = "";
  }
  function setLang(l) {
    if (l === lang) return;
    lang = l; store.set("eah-lang", l);
    $("#lang").dataset.on = l;
    if (reduced) { paint(); return; }
    document.body.classList.add("swap");
    setTimeout(function () {
      paint();
      requestAnimationFrame(function () { requestAnimationFrame(function () { document.body.classList.remove("swap"); }); });
    }, 190);
  }
  $("#lang").addEventListener("click", function (e) { var b = e.target.closest("[data-lang]"); if (b) setLang(b.dataset.lang); });

  /* ---------- project detail: grows out of the clicked card ---------- */
  var det = $("#detail"), dbody = $("#d-body"), cur = 0, busy = false, closing = false;
  function insetFor(el) {
    var r = el.getBoundingClientRect();
    return "inset(" + Math.max(0, r.top) + "px " + Math.max(0, innerWidth - r.right) + "px " + Math.max(0, innerHeight - r.bottom) + "px " + Math.max(0, r.left) + "px round 26px)";
  }
  var FULL = "inset(0px 0px 0px 0px round 0px)";
  function fillDetail(i) {
    var d = dict(), P = d.projects, p = P.items[i], n = P.items.length;
    var fig = p.fig === "sampling" ? samplingRow(p.rows.fixed, "fixed") + samplingRow(p.rows.adaptive, "adaptive")
      : p.fig === "roadmap" ? roadmapFig(p) : chainFig(p);
    var nb = p.bullets.length;
    dbody.innerHTML =
      '<p class="mono d-kind rise" style="--n:0">' + p.kind + " · " + (p.live ? '<span class="live-t">' + P.ongoing + "</span>" : p.when) + "</p>" +
      '<h2 class="d-title rise" id="d-title" style="--n:1">' + p.title + "</h2>" +
      '<div class="d-grid"><div>' +
      '<h3 class="sub rise" style="--n:2">' + P.did + "</h3>" +
      '<ul class="did">' + p.bullets.map(function (b, k) { return '<li class="rise" style="--n:' + (3 + k) + '">' + b + "</li>"; }).join("") + "</ul>" +
      (p.aim ? '<h3 class="sub rise" style="--n:' + (3 + nb) + '">' + p.aim.h + '</h3><p class="aim rise" style="--n:' + (4 + nb) + '">' + p.aim.t + "</p>" : "") +
      '<h3 class="sub rise" style="--n:' + (3 + nb + (p.aim ? 2 : 0)) + '">' + p.tagsLabel + "</h3>" +
      '<ul class="tags rise" style="--n:' + (4 + nb + (p.aim ? 2 : 0)) + '">' + p.tags.map(function (x) { return '<li class="chip">' + x + "</li>"; }).join("") + "</ul>" +
      (p.repo ? '<a class="btn repo rise" style="--n:' + (5 + nb + (p.aim ? 2 : 0)) + '" href="' + p.repo + '" target="_blank" rel="noopener">' + P.repo + ' <span aria-hidden="true">↗</span></a>' : "") +
      '</div><figure class="fig rise" style="--n:3">' + fig + '<figcaption class="mono">' + p.figCap + "</figcaption></figure></div>";
    $("#d-close").innerHTML = '<span aria-hidden="true">←</span>&nbsp;' + P.back;
    $("#d-count").textContent = (i + 1) + " / " + n;
    $("#d-prev").innerHTML = '<span class="mono">← ' + P.prev + "</span><strong>" + P.items[(i + n - 1) % n].title + "</strong>";
    $("#d-next").innerHTML = '<span class="mono">' + P.next + " →</span><strong>" + P.items[(i + 1) % n].title + "</strong>";
  }
  function openDetail(i, card) {
    var from = insetFor(card);
    cur = i; fillDetail(i);
    det.hidden = false; det.scrollTop = 0;
    root.classList.add("lock"); $("#page").setAttribute("inert", ""); det.classList.add("open");
    if (!reduced) det.animate([{ clipPath: from }, { clipPath: FULL }], { duration: 680, easing: "cubic-bezier(.22,.8,.18,1)" });
    $("#d-close").focus({ preventScroll: true });
  }
  function closeDetail() {
    if (det.hidden || closing) return;
    closing = true;
    var card = $('#cards [data-p="' + cur + '"]');
    var done = function () {
      det.getAnimations().forEach(function (a) { a.cancel(); });
      det.hidden = true; det.classList.remove("open");
      root.classList.remove("lock"); $("#page").removeAttribute("inert");
      closing = false;
      if (card) card.focus({ preventScroll: true });
    };
    if (reduced || !card) { done(); return; }
    card.scrollIntoView({ block: "nearest" });
    var a = det.animate([{ clipPath: FULL }, { clipPath: insetFor(card) }], { duration: 540, easing: "cubic-bezier(.5,0,.2,1)", fill: "forwards" });
    a.finished.then(done, done);
  }
  function go(dir) {
    if (det.hidden || busy) return;
    busy = true;
    var n = dict().projects.items.length, next = (cur + dir + n) % n;
    var swap = function () {
      cur = next; fillDetail(cur); det.scrollTop = 0;
      dbody.getAnimations().forEach(function (a) { a.cancel(); });
      if (!reduced) dbody.animate([{ opacity: 0, transform: "translateX(" + (30 * dir) + "px)" }, { opacity: 1, transform: "none" }], { duration: 420, easing: "cubic-bezier(.22,.8,.18,1)" });
      busy = false;
    };
    if (reduced) { swap(); return; }
    dbody.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateX(" + (-30 * dir) + "px)" }], { duration: 200, easing: "ease-in", fill: "forwards" }).finished.then(swap, swap);
  }
  $("#cards").addEventListener("click", function (e) { var b = e.target.closest(".card"); if (b) openDetail(+b.dataset.p, b); });
  $("#d-close").addEventListener("click", closeDetail);
  $("#d-prev").addEventListener("click", function () { go(-1); });
  $("#d-next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (det.hidden) return;
    if (e.key === "Escape") closeDetail();
    else if (e.key === "ArrowRight") go(1);
    else if (e.key === "ArrowLeft") go(-1);
  });

  /* ---------- navigation, copy buttons, strip controls ---------- */
  $$("[data-go]").forEach(function (a) {
    a.addEventListener("click", function (e) {
      e.preventDefault();
      var id = a.dataset.go;
      if (id === "top") { window.scrollTo({ top: 0, behavior: reduced ? "auto" : "smooth" }); return; }
      var el = document.getElementById(id);
      if (el) el.scrollIntoView({ behavior: reduced ? "auto" : "smooth", block: "start" });
      if (id === "cv" && !reduced) {
        var rib = el.querySelector(".cvrib");
        rib.classList.remove("ping");
        setTimeout(function () { void rib.offsetWidth; rib.classList.add("ping"); }, 450);
        rib.addEventListener("animationend", function done(ev) { if (ev.target === rib) { rib.classList.remove("ping"); rib.removeEventListener("animationend", done); } });
      }
    });
  });
  var links = $$(".nav a"), navEl = $(".nav"), navLock = null;
  function setOn(id) {
    links.forEach(function (a) {
      var on = a.dataset.go === id;
      a.classList.toggle("on", on);
      if (on) {
        a.setAttribute("aria-current", "true");
        if (navEl.scrollWidth > navEl.clientWidth) navEl.scrollTo({ left: Math.max(0, a.offsetLeft - (navEl.clientWidth - a.offsetWidth) / 2), behavior: reduced ? "auto" : "smooth" });

  ["wheel", "touchstart", "keydown", "mousedown"].forEach(function (t) {

  });

  if (window.IntersectionObserver) {
    var spy = new IntersectionObserver(function (es) {
      es.forEach(function (en) {
        if (!en.isIntersecting || navLock) return;
        setOn(en.target.id);
      });
    }, { rootMargin: "-35% 0px -60% 0px" });
    ["projects", "background", "skills", "cv", "contact"].forEach(function (id) { spy.observe(document.getElementById(id)); });
    new IntersectionObserver(function (es) { visible = es[0].isIntersecting; if (visible) startLoop(); else stopLoop(); }).observe(cv);
  }
  function flash(btn, key) {
    btn.textContent = pick(dict(), key);
    clearTimeout(btn._t);
    btn._t = setTimeout(function () { btn.textContent = pick(dict(), "contact.copy"); }, 1600);
  }
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-copy]");
    if (!b) return;
    var el = $(b.dataset.copy), txt = el.textContent.trim();
    var fallback = function () {
      var r = document.createRange(); r.selectNodeContents(el);
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      flash(b, "contact.selected");
    };
    try { navigator.clipboard.writeText(txt).then(function () { flash(b, "contact.copied"); }, fallback); } catch (err) { fallback(); }
  });
  /* CV downloads: when the viewer's host can save files, offer it through the
     "downloads" capability (they confirm); otherwise the link just opens the PDF. */
  var dl = null;
  try {
    if (window.claude && claude.use) claude.use("downloads").then(function (d) { dl = d || null; }, function () { dl = null; });
  } catch (err) { dl = null; }
  document.addEventListener("click", function (e) {
    var a = e.target.closest("[data-cv]");
    if (!a || !dl || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    if (a.getAttribute("aria-busy") === "true") return;
    var href = a.getAttribute("href"), name = href.split("/").pop();
    a.setAttribute("aria-busy", "true");
    fetch(href).then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r.blob(); })
      .then(function (blob) { return dl.save({ filename: name, data: blob }); })
      .then(function () {
        $("#cv-note").textContent = "✓ " + pick(dict(), "cv.saved") + " · " + name;
        if (!reduced) { a.classList.remove("drop"); void a.offsetWidth; a.classList.add("drop"); }
      })
      .catch(function (err) {
        if (err && err.code === "declined") return;
        window.open(href, "_blank", "noopener");
      })
      .then(function () { a.removeAttribute("aria-busy"); });
  });
  $("#flex").addEventListener("click", flex);
  cv.addEventListener("click", flex);
  document.addEventListener("visibilitychange", function () { if (document.hidden) stopLoop(); else startLoop(); });
  window.addEventListener("themechange", function () { readCols(); draw(); });
  if (window.ResizeObserver) new ResizeObserver(size).observe(cv); else window.addEventListener("resize", size);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(syncPanels);
  window.addEventListener("resize", syncPanels);

  /* ---------- start ---------- */
  paint();
  size();
  startLoop();
})();
</script>
